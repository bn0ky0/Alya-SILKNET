<svg xmlns="http://www.w3.org/2000/svg" width="760" height="190" viewBox="0 0 760 190" role="img" aria-labelledby="title desc">
  <title id="title">Buy me a coffee — support Alya SILKNET</title>
  <desc id="desc">A dark, neon pink and purple donation banner with a coffee cup and the words Buy me a coffee, support Alya SILKNET via InstaPay.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171321"/>
      <stop offset="0.58" stop-color="#21152e"/>
      <stop offset="1" stop-color="#10121c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff83c9"/>
      <stop offset="0.55" stop-color="#c78bff"/>
      <stop offset="1" stop-color="#7be7e1"/>
    </linearGradient>
    <linearGradient id="cup" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff1fa"/>
      <stop offset="1" stop-color="#e5c9ff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect x="1" y="1" width="758" height="188" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="760" height="190" rx="24" fill="url(#bg)"/>
    <circle cx="710" cy="-8" r="112" fill="#ba73ff" opacity=".12"/>
    <circle cx="88" cy="192" r="118" fill="#ff75c8" opacity=".10"/>
    <path d="M0 151 C150 100 190 217 350 159 S600 92 760 143" fill="none" stroke="url(#accent)" stroke-opacity=".18" stroke-width="2"/>
    <rect x="1" y="1" width="758" height="188" rx="23" fill="none" stroke="url(#accent)" stroke-opacity=".65" stroke-width="1.5"/>
    <!-- cup icon -->
    <g transform="translate(35 34)">
      <circle cx="57" cy="59" r="55" fill="#ff83c9" opacity=".13" filter="url(#glow)"/>
      <path d="M44 22 C32 12 50 6 43 -1 M62 22 C50 12 68 6 61 -1 M80 22 C68 12 86 6 79 -1" fill="none" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
      <path d="M21 34 H87 L81 88 Q79 99 67 99 H42 Q30 99 28 88 Z" fill="url(#cup)"/>
      <path d="M86 43 H96 Q111 43 108 58 Q106 73 84 73" fill="none" stroke="#f2dcff" stroke-width="8" stroke-linecap="round"/>
      <ellipse cx="54" cy="35" rx="33" ry="8" fill="#53345f"/>
      <ellipse cx="54" cy="35" rx="29" ry="5.5" fill="#6c3a61"/>
      <path d="M26 78 Q53 86 81 78" fill="none" stroke="#c77ed8" stroke-width="2" opacity=".65"/>
      <path d="M43 53 l7 7 -7 7 M57 53 l7 7 -7 7" fill="none" stroke="#9d4d98" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g font-family="Inter, Segoe UI, Arial, sans-serif">
      <text x="176" y="61" font-size="14" font-weight="700" letter-spacing="3.2" fill="#f6b3e2">SUPPORT ALYA SILKNET</text>
      <text x="174" y="105" font-size="34" font-weight="800" letter-spacing=".2" fill="#fff4ff">BUY ME A COFFEE</text>
      <text x="176" y="132" font-size="15" font-weight="500" fill="#cfc2df">Help keep Alya SILKNET growing.</text>
      <rect x="176" y="146" width="174" height="27" rx="13.5" fill="url(#accent)"/>
      <text x="263" y="164" font-size="12" font-weight="800" letter-spacing="1.1" fill="#21152e" text-anchor="middle">EGP · INSTAPAY</text>
      <text x="711" y="163" font-size="13" font-weight="700" fill="#bcb1cd" text-anchor="end">bnoky0</text>
    </g>
  </g>
</svg>
