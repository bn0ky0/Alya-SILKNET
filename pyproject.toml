[build-system]
requires = ["setuptools>=75,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "silknet"
version = "0.1.2"
description = "Open-source relationship mapping and OSINT platform"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "SILKNET contributors" }]
dependencies = ["PySide6-Essentials>=6.8,<7"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "ruff>=0.11,<1"]
build = ["pyinstaller>=6.10,<7"]

[project.scripts]
silknet = "silknet.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
silknet = [
    "assets/*.jpg",
    "assets/*.ico",
    "assets/*.png",
    "assets/fonts/*.ttf",
    "assets/fonts/*.txt",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

